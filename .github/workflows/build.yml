name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build
        run: msbuild AIBalance.vcxproj -m -p:Configuration=Release -p:Platform=x64 -p:OutDir="${{ github.workspace }}\out\"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AIBalance-x64
          path: out/AIBalance.dll
